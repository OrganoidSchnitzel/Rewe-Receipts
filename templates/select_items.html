<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Select items</title>
</head>
<body>
  <h1>Select items to transfer to Spliit</h1>

  {% if items %}
  <form action="/send-to-spliit" method="post">
    <input type="hidden" name="item_count" value="{{ items|length }}" />
    <input type="hidden" name="receipt_id" value="{{ receipt_id }}" />
    <ul>
      {% for item in items %}
      <li>
        <label>
          <input
            type="checkbox"
            name="selected_indices"
            value="{{ loop.index0 }}"
            {% if loop.index0 in preselected_indices %}checked{% endif %}
          />
          {{ item.name }} — €{{ "%.2f"|format(item.price) }}
        </label>
        <input type="hidden" name="item_name_{{ loop.index0 }}" value="{{ item.name }}" />
        <input type="hidden" name="item_price_{{ loop.index0 }}" value="{{ item.price }}" />
      </li>
      {% endfor %}
    </ul>
    <button type="submit">Transfer selected amount</button>
  </form>
  {% else %}
    <p>No recognizable receipt items found. Try a different OCR text or PDF.</p>
  {% endif %}

  <p><a href="/">Back</a></p>
  <p><a href="/receipts">Processed receipts</a></p>
</body>
</html>
