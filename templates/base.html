<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>{% block title %}Receipt Importer{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <img class="brand-mark" src="{{ url_for('static', filename='favicon.svg') }}"
             alt="" width="32" height="32" />
        <span class="brand-name">Receipt Importer</span>
      </a>
      <nav class="nav">
        <a href="{{ url_for('index') }}">Receipts</a>
        <a href="{{ url_for('manual_form') }}">Add</a>
        <form action="{{ url_for('manual_poll') }}" method="post" class="nav-form">
          <button type="submit" class="btn-ghost">Poll Paperless</button>
        </form>
        {% if lidl_enabled %}
        <form action="{{ url_for('manual_poll_lidl') }}" method="post" class="nav-form">
          <button type="submit" class="btn-ghost">Poll Lidl</button>
        </form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="page">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="toasts">
          {% for message in messages %}
            <div class="toast" role="status">
              <span>{{ message }}</span>
              <button type="button" class="toast-close" aria-label="Dismiss"
                      onclick="this.parentElement.remove()">×</button>
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
