{% extends "base.html" %}

{% block title %}REWE Receipts → Spliit{% endblock %}

{% block content %}
  <section class="card">
    <h1>REWE & Lidl Receipts → Spliit</h1>
    <p class="muted">Upload a PDF, paste OCR text from paperless-ngx, or import from Lidl Plus API to detect items for splitting.</p>
    <p><a href="/receipts">View processed receipts</a></p>

    <form action="/parse" method="post" enctype="multipart/form-data">
      <p>
        <label for="store_source">Store source</label>
        <select id="store_source" name="store_source">
          <option value="rewe" selected>REWE (paperless-ngx / PDF)</option>
          <option value="lidl">Lidl (Plus API JSON)</option>
        </select>
      </p>
      <p>
        <label for="receipt_pdf">Receipt PDF</label>
        <input id="receipt_pdf" name="receipt_pdf" type="file" accept="application/pdf" />
      </p>
      <p>
        <label for="receipt_text">Receipt text (paperless OCR or Lidl API JSON)</label>
        <textarea id="receipt_text" name="receipt_text"></textarea>
      </p>
      <button type="submit">Parse receipt</button>
    </form>
  </section>
{% endblock %}
