# Receipt Importer service.
#
# This service must share a Docker network with your existing Paperless-ngx and
# Spliit containers so it can reach them by container name. Two ways to wire it:
#
#  A) Add this `receipt-importer` service block to the SAME docker-compose.yml
#     that already defines paperless + spliit (recommended). Then you can use
#     internal URLs, e.g. PAPERLESS_URL=http://paperless-webserver:8000 and
#     SPLIIT_URL=http://spliit:3000.
#
#  B) Keep it standalone (this file) and attach it to the existing external
#     network (see the `networks` block at the bottom). Then the LAN IPs in
#     .env.example (192.168.178.100:*) also work.
#
# On Unraid, the volume maps to appdata, matching the existing convention.

services:
  receipt-importer:
    build: .
    # image: receipt-importer:latest   # or pull/push a prebuilt image
    container_name: receipt-importer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Unraid appdata convention; adjust host path to your setup.
      - /mnt/user/appdata/receipt-importer:/app/data
    networks:
      - receipts-net

# Option B: attach to the network your Paperless/Spliit stack already uses.
# Find it with: docker network ls  (and `docker inspect <container>` to confirm).
# Replace `paperless_default` with that network's real name and set
# `external: true` so this compose file joins it instead of creating a new one.
networks:
  receipts-net:
    name: paperless_default
    external: true
